<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมทายคำศัพท์ภาษาอังกฤษ 🍎🐶👁️</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe for Hand Tracking (Hand Mode) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- MediaPipe for Pose/Head Tracking (Head Mode) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0fdf4;
        }
        
        .mirrored {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        .item-emoji {
            font-size: 16rem;
            line-height: 1.1;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .item-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 4px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .hit-zone {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .hit-zone.active, .hit-zone:hover.mouse-mode-active {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        #loading-overlay {
            z-index: 1000;
        }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- Camera Video (Hidden, used as source for AI) -->
    <video id="videoElement" class="hidden" autoplay playsinline></video>
    
    <!-- Canvas for drawing camera feed and AI landmarks -->
    <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover mirrored z-0"></canvas>

    <!-- Overlay for darkening camera slightly -->
    <div class="absolute inset-0 bg-black/20 z-0 pointer-events-none"></div>

    <!-- UI Layer -->
    <div class="absolute inset-0 z-10 flex flex-col justify-between p-4 pointer-events-none">
        
        <!-- Gameplay Options (Left and Right) -->
        <div id="optionsContainer" class="hidden flex justify-between items-start w-full max-w-7xl mx-auto mt-4 pointer-events-none">
            
            <!-- Left Option -->
            <div id="leftOptionUI" onclick="handleMouseClick('left')" class="hit-zone glass-panel w-1/3 max-w-sm rounded-3xl p-6 text-center border-b-8 border-b-orange-500 relative overflow-hidden pointer-events-auto">
                <div class="absolute bottom-0 left-0 w-full h-2 bg-orange-500"></div>
                <p id="leftInstruction" class="text-xl text-gray-500 font-semibold mb-2">ยกมือแตะฝั่งซ้าย</p>
                <p id="leftText" class="text-5xl font-black text-gray-800 break-words">Apple</p>
                <div class="mt-4 text-orange-500 text-opacity-50 text-6xl font-black absolute -right-4 top-4">L</div>
            </div>

            <!-- Score Container -->
            <div id="scoreContainer" class="hidden glass-panel rounded-3xl px-6 py-3 items-center gap-3 pointer-events-auto">
                <span class="text-4xl">🌟</span>
                <div class="text-2xl font-bold text-gray-800">คะแนน: <span id="scoreDisplay" class="text-green-600 text-3xl">0</span></div>
            </div>

            <!-- Right Option -->
            <div id="rightOptionUI" onclick="handleMouseClick('right')" class="hit-zone glass-panel w-1/3 max-w-sm rounded-3xl p-6 text-center border-b-8 border-b-purple-500 relative overflow-hidden pointer-events-auto">
                <div class="absolute bottom-0 right-0 w-full h-2 bg-purple-500"></div>
                <p id="rightInstruction" class="text-xl text-gray-500 font-semibold mb-2">ยกมือแตะฝั่งขวา</p>
                <p id="rightText" class="text-5xl font-black text-gray-800 break-words">Banana</p>
                <div class="mt-4 text-purple-500 text-opacity-50 text-6xl font-black absolute -left-4 top-4">R</div>
            </div>

        </div>

        <!-- Center Area (Menus & Game Core) -->
        <div class="flex-grow flex flex-col items-center justify-center pointer-events-none">
            
            <!-- STEP 1: Category Selection Menu -->
            <div id="categoryMenu" class="glass-panel rounded-[3rem] p-10 flex flex-col items-center justify-center pointer-events-auto transition-all">
                <h1 class="text-5xl font-black text-gray-800 mb-8 text-center">เกมทายคำศัพท์<br><span class="text-blue-500 text-3xl">ขั้นตอนที่ 1: เลือกหมวดหมู่</span></h1>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="selectCategory('fruits')" class="bg-red-500 hover:bg-red-600 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🍉</span>
                        หมวดผลไม้<br><span class="text-lg font-normal">(30 ข้อ)</span>
                    </button>
                    
                    <button onclick="selectCategory('animals')" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🐯</span>
                        หมวดสัตว์<br><span class="text-lg font-normal">(30 ข้อ)</span>
                    </button>

                    <button onclick="selectCategory('bodyParts')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">👁️</span>
                        หมวดอวัยวะ<br><span class="text-lg font-normal">(20 ข้อ)</span>
                    </button>
                </div>
            </div>

            <!-- STEP 2: Mode Selection Menu -->
            <div id="modeMenu" class="hidden glass-panel rounded-[3rem] p-10 flex flex-col items-center justify-center pointer-events-auto transition-all">
                <h1 class="text-5xl font-black text-gray-800 mb-8 text-center">เกมทายคำศัพท์<br><span class="text-purple-500 text-3xl">ขั้นตอนที่ 2: เลือกวิธีตอบคำถาม</span></h1>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="selectMode('hand')" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🖐️</span>
                        ใช้มือ<br><span class="text-lg font-normal">(ยกมือแตะซ้าย/ขวา)</span>
                    </button>
                    
                    <button onclick="selectMode('head')" class="bg-teal-500 hover:bg-teal-600 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🗣️</span>
                        ใช้หัว<br><span class="text-lg font-normal">(เอียงหัวซ้าย/ขวา)</span>
                    </button>

                    <button onclick="selectMode('mouse')" class="bg-gray-700 hover:bg-gray-800 text-white font-bold text-2xl py-6 px-8 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🖱️</span>
                        ใช้เมาส์<br><span class="text-lg font-normal">(ใช้เมาส์คลิกตอบ)</span>
                    </button>
                </div>
                <button onclick="backToCategory()" class="mt-8 text-gray-500 underline hover:text-gray-800 text-xl">ย้อนกลับไปเลือกหมวดหมู่</button>
            </div>

            <!-- Current Item Display -->
            <div id="gameCenter" class="hidden flex-col items-center justify-center">
                <div class="glass-panel rounded-[3rem] p-8 flex flex-col items-center justify-center min-w-[300px]">
                    <h2 class="text-3xl font-bold text-gray-500 mb-2">รูปนี้คืออะไร?</h2>
                    <div id="itemDisplay" class="item-emoji">🍎</div>
                    <div id="feedbackText" class="text-5xl font-extrabold mt-4 h-16 opacity-0 transition-opacity drop-shadow-md">ยอดเยี่ยม!</div>
                </div>
            </div>
            
        </div>
        
        <div class="h-10"></div>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="absolute bottom-6 right-6 glass-panel rounded-full p-4 flex items-center justify-center hover:scale-110 transition-transform pointer-events-auto shadow-xl z-50 bg-white/80" title="เต็มจอ">
            <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
            </svg>
        </button>
    </div>

    <!-- Loading Screen Overlay -->
    <div id="loading-overlay" class="absolute inset-0 bg-white flex flex-col items-center justify-center hidden">
        <div class="w-16 h-16 border-8 border-blue-200 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <h2 id="loading-text" class="text-3xl font-bold text-gray-700">กำลังโหลดกล้องและ AI...</h2>
        <p class="text-gray-500 mt-2 text-xl">กรุณาอนุญาตการใช้งานกล้อง</p>
    </div>

    <script>
        // Vocabulary Databases

        // 1. Fruits (30 items)
        const fruitsData = [
            { name: "Apple", emoji: "🍎" }, { name: "Banana", emoji: "🍌" },
            { name: "Orange", emoji: "🍊" }, { name: "Grape", emoji: "🍇" },
            { name: "Strawberry", emoji: "🍓" }, { name: "Watermelon", emoji: "🍉" },
            { name: "Mango", emoji: "🥭" }, { name: "Pineapple", emoji: "🍍" },
            { name: "Cherry", emoji: "🍒" }, { name: "Peach", emoji: "🍑" },
            { name: "Coconut", emoji: "🥥" }, { name: "Kiwi", emoji: "🥝" },
            { name: "Lemon", emoji: "🍋" }, { name: "Melon", emoji: "🍈" },
            { name: "Pear", emoji: "🍐" }, { name: "Avocado", emoji: "🥑" },
            { name: "Blueberry", emoji: "🫐" }, { name: "Tomato", emoji: "🍅" },
            { name: "Green Apple", emoji: "🍏" }, { name: "Lime", emoji: "🍋‍🟩" },
            { name: "Papaya", emoji: "🥭" }, { name: "Pomegranate", emoji: "🍎" },
            { name: "Raspberry", emoji: "🍓" }, { name: "Blackberry", emoji: "🫐" },
            { name: "Plum", emoji: "🍇" }, { name: "Apricot", emoji: "🍑" },
            { name: "Guava", emoji: "🍐" }, { name: "Lychee", emoji: "🍒" },
            { name: "Dragon Fruit", emoji: "🐲" }, { name: "Starfruit", emoji: "🌟" }
        ];

        // 2. Animals (30 items)
        const animalsData = [
            { name: "Dog", emoji: "🐶" }, { name: "Cat", emoji: "🐱" },
            { name: "Mouse", emoji: "🐭" }, { name: "Hamster", emoji: "🐹" },
            { name: "Rabbit", emoji: "🐰" }, { name: "Fox", emoji: "🦊" },
            { name: "Bear", emoji: "🐻" }, { name: "Panda", emoji: "🐼" },
            { name: "Koala", emoji: "🐨" }, { name: "Tiger", emoji: "🐯" },
            { name: "Lion", emoji: "🦁" }, { name: "Cow", emoji: "🐮" },
            { name: "Pig", emoji: "🐷" }, { name: "Frog", emoji: "🐸" },
            { name: "Monkey", emoji: "🐵" }, { name: "Chicken", emoji: "🐔" },
            { name: "Penguin", emoji: "🐧" }, { name: "Bird", emoji: "🐦" },
            { name: "Elephant", emoji: "🐘" }, { name: "Horse", emoji: "🐴" },
            { name: "Sheep", emoji: "🐑" }, { name: "Goat", emoji: "🐐" },
            { name: "Duck", emoji: "🦆" }, { name: "Owl", emoji: "🦉" },
            { name: "Bat", emoji: "🦇" }, { name: "Wolf", emoji: "🐺" },
            { name: "Deer", emoji: "🦌" }, { name: "Zebra", emoji: "🦓" },
            { name: "Giraffe", emoji: "🦒" }, { name: "Rhino", emoji: "🦏" }
        ];

        // 3. Body Parts (20 items)
        const bodyPartsData = [
            { name: "Eye", emoji: "👁️" }, { name: "Ear", emoji: "👂" },
            { name: "Nose", emoji: "👃" }, { name: "Mouth", emoji: "👄" },
            { name: "Tooth", emoji: "🦷" }, { name: "Tongue", emoji: "👅" },
            { name: "Hair", emoji: "💇" }, { name: "Head", emoji: "🗣️" },
            { name: "Face", emoji: "👱" }, { name: "Neck", emoji: "🧣" },
            { name: "Shoulder", emoji: "🤷" }, { name: "Arm", emoji: "💪" },
            { name: "Hand", emoji: "🖐️" }, { name: "Finger", emoji: "☝️" },
            { name: "Chest", emoji: "🫁" }, { name: "Stomach", emoji: "🤰" },
            { name: "Leg", emoji: "🦵" }, { name: "Knee", emoji: "🦿" },
            { name: "Foot", emoji: "🦶" }, { name: "Toe", emoji: "👣" }
        ];

        // State Variables
        let score = 0;
        let isPlaying = false;
        let currentQuestion = null;
        let isProcessingAnswer = false;
        
        // Selected Settings
        let selectedCategory = null; 
        let currentVocabulary = []; 
        let currentPlayMode = null; // 'hand', 'head', 'mouse'
        
        // DOM Elements
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const categoryMenu = document.getElementById('categoryMenu');
        const modeMenu = document.getElementById('modeMenu');
        const gameCenter = document.getElementById('gameCenter');
        
        const optionsContainer = document.getElementById('optionsContainer');
        const leftOptionUI = document.getElementById('leftOptionUI');
        const rightOptionUI = document.getElementById('rightOptionUI');
        const leftInstruction = document.getElementById('leftInstruction');
        const rightInstruction = document.getElementById('rightInstruction');
        
        const scoreContainer = document.getElementById('scoreContainer');
        const itemDisplay = document.getElementById('itemDisplay');
        const leftText = document.getElementById('leftText');
        const rightText = document.getElementById('rightText');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const feedbackText = document.getElementById('feedbackText');

        // Audio setup
        let synth, errorSynth;
        
        function initAudio() {
            if(synth) return; 
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 1 }
            }).toDestination();
            
            errorSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.5 }
            }).toDestination();
        }

        function playSuccessSound() {
            if(!synth) return;
            Tone.start();
            synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
        }

        function playErrorSound() {
            if(!errorSynth) return;
            Tone.start();
            errorSynth.triggerAttackRelease("C3", "4n");
        }

        // Step 1: Select Category
        function selectCategory(cat) {
            initAudio(); // Need user interaction to initialize Web Audio API
            
            selectedCategory = cat;
            if(cat === 'fruits') currentVocabulary = fruitsData;
            else if (cat === 'animals') currentVocabulary = animalsData;
            else if (cat === 'bodyParts') currentVocabulary = bodyPartsData;

            // Transition to Step 2
            categoryMenu.classList.add('hidden');
            modeMenu.classList.remove('hidden');
            modeMenu.classList.add('flex');
        }

        // Back Button
        function backToCategory() {
            modeMenu.classList.add('hidden');
            modeMenu.classList.remove('flex');
            categoryMenu.classList.remove('hidden');
        }

        // Step 2: Select Mode and Start
        function selectMode(mode) {
            currentPlayMode = mode;
            
            // Update UI Instructions based on mode
            if (mode === 'hand') {
                leftInstruction.innerText = "ยกมือแตะฝั่งซ้าย";
                rightInstruction.innerText = "ยกมือแตะฝั่งขวา";
                leftOptionUI.classList.remove('mouse-mode-active');
                rightOptionUI.classList.remove('mouse-mode-active');
            } else if (mode === 'head') {
                leftInstruction.innerText = "เอียงหัวมาฝั่งซ้าย";
                rightInstruction.innerText = "เอียงหัวมาฝั่งขวา";
                leftOptionUI.classList.remove('mouse-mode-active');
                rightOptionUI.classList.remove('mouse-mode-active');
            } else if (mode === 'mouse') {
                leftInstruction.innerText = "คลิกฝั่งซ้าย";
                rightInstruction.innerText = "คลิกฝั่งขวา";
                // Add hover class for mouse mode
                leftOptionUI.classList.add('mouse-mode-active');
                rightOptionUI.classList.add('mouse-mode-active');
            }

            modeMenu.classList.add('hidden');
            modeMenu.classList.remove('flex');
            
            startCameraSetup();
        }

        function beginGameplay() {
            gameCenter.classList.remove('hidden');
            gameCenter.classList.add('flex');
            optionsContainer.classList.remove('hidden');
            optionsContainer.classList.add('flex');
            scoreContainer.classList.remove('hidden');
            scoreContainer.classList.add('flex');
            
            score = 0;
            updateScoreDisplay();
            isPlaying = true;
            nextQuestion();
        }

        function nextQuestion() {
            isProcessingAnswer = false;
            
            // Reset UI styles
            feedbackText.style.opacity = '0';
            itemDisplay.classList.remove('item-pop');
            leftOptionUI.classList.remove('bg-green-100', 'bg-red-100', 'border-b-green-500', 'border-b-red-500', 'border-b-orange-500');
            rightOptionUI.classList.remove('bg-green-100', 'bg-red-100', 'border-b-green-500', 'border-b-red-500', 'border-b-purple-500');
            
            leftOptionUI.classList.add('border-b-orange-500');
            rightOptionUI.classList.add('border-b-purple-500');
            leftOptionUI.style.transform = 'scale(1)';
            rightOptionUI.style.transform = 'scale(1)';

            // Select random target and wrong option
            const targetItem = currentVocabulary[Math.floor(Math.random() * currentVocabulary.length)];
            let wrongItem;
            do {
                wrongItem = currentVocabulary[Math.floor(Math.random() * currentVocabulary.length)];
            } while (wrongItem.name === targetItem.name);

            // Randomize left/right side
            const isTargetLeft = Math.random() > 0.5;

            currentQuestion = {
                target: targetItem,
                leftOption: isTargetLeft ? targetItem.name : wrongItem.name,
                rightOption: !isTargetLeft ? targetItem.name : wrongItem.name,
                correctSide: isTargetLeft ? 'left' : 'right'
            };

            // Animate and Update UI
            void itemDisplay.offsetWidth; 
            itemDisplay.innerText = targetItem.emoji;
            itemDisplay.classList.add('item-pop');
            leftText.innerText = currentQuestion.leftOption;
            rightText.innerText = currentQuestion.rightOption;
        }

        function handleMouseClick(side) {
            if (currentPlayMode === 'mouse' && isPlaying && !isProcessingAnswer) {
                handleAnswer(side);
            }
        }

        function handleAnswer(selectedSide) {
            if (isProcessingAnswer || !isPlaying) return;
            isProcessingAnswer = true;

            const isCorrect = (selectedSide === currentQuestion.correctSide);
            const selectedUI = selectedSide === 'left' ? leftOptionUI : rightOptionUI;

            selectedUI.style.transform = 'scale(1.1)';

            if (isCorrect) {
                score += 10;
                updateScoreDisplay();
                playSuccessSound();
                selectedUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                selectedUI.classList.add('bg-green-100', 'border-b-green-500');
                showFeedback("ถูกต้อง! 🎉", "text-green-500");
            } else {
                playErrorSound();
                selectedUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                selectedUI.classList.add('bg-red-100', 'border-b-red-500');
                
                // Show which one was correct
                const correctUI = currentQuestion.correctSide === 'left' ? leftOptionUI : rightOptionUI;
                correctUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                correctUI.classList.add('bg-green-100', 'border-b-green-500');
                
                showFeedback("ผิดจ้า! 😢", "text-red-500");
            }

            // Delay next question based on mode (Give them time to return to neutral posture)
            const delay = currentPlayMode === 'mouse' ? 1500 : 2500;
            setTimeout(() => {
                nextQuestion();
            }, delay);
        }

        function showFeedback(text, colorClass) {
            feedbackText.innerText = text;
            feedbackText.className = `text-5xl font-extrabold mt-4 h-16 transition-opacity drop-shadow-md ${colorClass}`;
            feedbackText.style.opacity = '1';
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = score;
        }

        
        // Setup MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        // Setup MediaPipe Pose (For Head Tracking)
        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        // Hands Callback
        hands.onResults((results) => {
            if (currentPlayMode !== 'hand') return;
            drawCameraFeed(results.image);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#3B82F6', lineWidth: 2, radius: 4});

                    if (isPlaying && !isProcessingAnswer) {
                        const referencePoint = landmarks[8]; // Index finger tip
                        const rawY = referencePoint.y;
                        const rawX = referencePoint.x;
                        
                        // Y < 0.4 means top 40% of screen.
                        if (rawY < 0.4) {
                            if (rawX > 0.6) { // Visual Left
                                leftOptionUI.classList.add('active');
                                rightOptionUI.classList.remove('active');
                                handleAnswer('left');
                            } else if (rawX < 0.4) { // Visual Right
                                rightOptionUI.classList.add('active');
                                leftOptionUI.classList.remove('active');
                                handleAnswer('right');
                            } else {
                                resetHitZones();
                            }
                        } else {
                            resetHitZones();
                        }
                    }
                }
            } else {
                resetHitZones();
            }
            canvasCtx.restore();
        });

        // Pose Callback (Head Tracking)
        pose.onResults((results) => {
            if (currentPlayMode !== 'head') return;
            drawCameraFeed(results.image);
            
            if (results.poseLandmarks) {
                // Draw Pose Landmarks (Nose, Shoulders)
                const landmarks = results.poseLandmarks;
                // Just draw a circle on the nose for visual feedback
                drawLandmarks(canvasCtx, [landmarks[0]], {color: '#EF4444', lineWidth: 2, radius: 8});

                if (isPlaying && !isProcessingAnswer) {
                    const nose = landmarks[0];
                    const rawX = nose.x;
                    
                    // Lean Left/Right heavily to trigger
                    if (rawX > 0.65) { // Visual Left
                        leftOptionUI.classList.add('active');
                        rightOptionUI.classList.remove('active');
                        handleAnswer('left');
                    } else if (rawX < 0.35) { // Visual Right
                        rightOptionUI.classList.add('active');
                        leftOptionUI.classList.remove('active');
                        handleAnswer('right');
                    } else {
                        resetHitZones();
                    }
                }
            } else {
                resetHitZones();
            }
            canvasCtx.restore();
        });

        function drawCameraFeed(image) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(image, 0, 0, canvasElement.width, canvasElement.height);
            // Don't restore yet, let the specific handlers draw landmarks and then restore
        }

        function drawMouseModeFeed(video) {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();
        }

        function resetHitZones() {
            if (isPlaying && !isProcessingAnswer) {
                leftOptionUI.classList.remove('active');
                rightOptionUI.classList.remove('active');
            }
        }

        let cameraStarted = false;
        let cameraObj;

        function startCameraSetup() {
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = currentPlayMode === 'mouse' ? "กำลังเปิดกล้อง..." : "กำลังโหลดกล้องและ AI ตรวจจับ...";
            
            if (!cameraStarted) {
                cameraObj = new Camera(videoElement, {
                    onFrame: async () => {
                        // Send frames only to the needed AI to save resources
                        if (currentPlayMode === 'hand') {
                            await hands.send({image: videoElement});
                        } else if (currentPlayMode === 'head') {
                            await pose.send({image: videoElement});
                        } else if (currentPlayMode === 'mouse') {
                            drawMouseModeFeed(videoElement);
                        }
                    },
                    width: 1280,
                    height: 720
                });

                cameraObj.start().then(() => {
                    loadingOverlay.classList.add('hidden');
                    cameraStarted = true;
                    beginGameplay();
                }).catch(err => {
                    loadingOverlay.classList.add('hidden');
                    modeMenu.classList.remove('hidden');
                    alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้องในเบราว์เซอร์ของคุณ");
                    console.error(err);
                });
            } else {
                // Camera already running, just clear loading and start
                loadingOverlay.classList.add('hidden');
                beginGameplay();
            }
        }

        // Fullscreen Logic
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />`;
                fullscreenBtn.title = "ยุบหน้าจอ";
            } else {
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />`;
                fullscreenBtn.title = "เต็มจอ";
            }
        });

        window.addEventListener('resize', () => {
            if(videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }
        });

    </script>
</body>
</html>
