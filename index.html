<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมทายคำศัพท์ด้วยท่าทาง 🍎🐶</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" crossorigin="anonymous"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #f0fdf4; /* Light green background */
        }
        
        /* Mirror the video and canvas so it acts like a mirror for the kids */
        .mirrored {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        .item-emoji {
            font-size: 10rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .item-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 4px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Hover zones for UI */
        .hit-zone {
            transition: all 0.2s ease;
        }
        .hit-zone.active {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        #loading-overlay {
            z-index: 1000;
        }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- Camera Video (Hidden, used as source for AI) -->
    <video id="videoElement" class="hidden" autoplay playsinline></video>
    
    <!-- Canvas for drawing camera feed and hand tracking (Full screen background) -->
    <canvas id="outputCanvas" class="absolute inset-0 w-full h-full object-cover mirrored z-0"></canvas>

    <!-- Overlay for darkening camera slightly -->
    <div class="absolute inset-0 bg-black/20 z-0 pointer-events-none"></div>

    <!-- UI Layer -->
    <div class="absolute inset-0 z-10 flex flex-col justify-between p-4 pointer-events-none">
        
        <!-- Top: Options (Left and Right) moved here for high reach -->
        <div id="optionsContainer" class="hidden flex justify-between items-start w-full max-w-7xl mx-auto mt-4 pointer-events-none">
            
            <!-- Left Option -->
            <div id="leftOptionUI" class="hit-zone glass-panel w-1/3 max-w-sm rounded-3xl p-6 text-center border-b-8 border-b-orange-500 relative overflow-hidden pointer-events-auto">
                <div class="absolute bottom-0 left-0 w-full h-2 bg-orange-500"></div>
                <p class="text-xl text-gray-500 font-semibold mb-2">ยกมือแตะฝั่งซ้าย</p>
                <p id="leftText" class="text-5xl font-black text-gray-800 break-words">Apple</p>
                <div class="mt-4 text-orange-500 text-opacity-50 text-6xl font-black absolute -right-4 top-4">L</div>
            </div>

            <!-- Header: Score (Moved to center top when options are shown) -->
            <div id="scoreContainer" class="hidden glass-panel rounded-3xl px-6 py-3 items-center gap-3 pointer-events-auto">
                <span class="text-4xl">🌟</span>
                <div class="text-2xl font-bold text-gray-800">คะแนน: <span id="scoreDisplay" class="text-green-600 text-3xl">0</span></div>
            </div>

            <!-- Right Option -->
            <div id="rightOptionUI" class="hit-zone glass-panel w-1/3 max-w-sm rounded-3xl p-6 text-center border-b-8 border-b-purple-500 relative overflow-hidden pointer-events-auto">
                <div class="absolute bottom-0 right-0 w-full h-2 bg-purple-500"></div>
                <p class="text-xl text-gray-500 font-semibold mb-2">ยกมือแตะฝั่งขวา</p>
                <p id="rightText" class="text-5xl font-black text-gray-800 break-words">Banana</p>
                <div class="mt-4 text-purple-500 text-opacity-50 text-6xl font-black absolute -left-4 top-4">R</div>
            </div>

        </div>

        <!-- Center: Main Menu & Game Area -->
        <div class="flex-grow flex flex-col items-center justify-center pointer-events-none">
            
            <!-- Mode Selection Menu -->
            <div id="mainMenu" class="glass-panel rounded-[3rem] p-10 flex flex-col items-center justify-center pointer-events-auto">
                <h1 class="text-5xl font-black text-gray-800 mb-8 text-center">เกมทายคำศัพท์<br><span class="text-blue-500 text-3xl">ด้วยท่าทาง</span></h1>
                <p class="text-2xl text-gray-600 mb-6">เลือกหมวดหมู่ที่ต้องการเล่น</p>
                
                <div class="flex gap-6">
                    <button id="btnFruitsMode" class="bg-red-500 hover:bg-red-600 text-white font-bold text-3xl py-6 px-10 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🍎</span>
                        หมวดผลไม้
                    </button>
                    
                    <button id="btnAnimalsMode" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold text-3xl py-6 px-10 rounded-[2rem] shadow-xl transition-transform hover:scale-105 border-4 border-white flex flex-col items-center">
                        <span class="text-6xl mb-2">🐶</span>
                        หมวดสัตว์
                    </button>
                </div>
            </div>

            <!-- Current Item Display -->
            <div id="gameCenter" class="hidden flex-col items-center justify-center">
                <div class="glass-panel rounded-[3rem] p-8 flex flex-col items-center justify-center min-w-[300px]">
                    <h2 class="text-3xl font-bold text-gray-500 mb-2">รูปนี้คืออะไร?</h2>
                    <div id="itemDisplay" class="item-emoji">🍎</div>
                    <div id="feedbackText" class="text-5xl font-extrabold mt-4 h-16 opacity-0 transition-opacity drop-shadow-md">ยอดเยี่ยม!</div>
                </div>
            </div>
            
        </div>
        
        <!-- Bottom padding for balance -->
        <div class="h-10"></div>

        <!-- Fullscreen Button -->
        <button id="fullscreenBtn" class="absolute bottom-6 right-6 glass-panel rounded-full p-4 flex items-center justify-center hover:scale-110 transition-transform pointer-events-auto shadow-xl z-50 bg-white/80" title="เต็มจอ">
            <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <!-- Expand Icon -->
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
            </svg>
        </button>
    </div>

    <!-- Loading Screen Overlay -->
    <div id="loading-overlay" class="absolute inset-0 bg-white flex flex-col items-center justify-center hidden">
        <div class="w-16 h-16 border-8 border-blue-200 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <h2 class="text-3xl font-bold text-gray-700">กำลังโหลดระบบ AI กล้อง...</h2>
        <p class="text-gray-500 mt-2 text-xl">กรุณาอนุญาตการใช้งานกล้อง</p>
    </div>

    <script>
        // Game Vocabulary Data - 20 Fruits
        const fruits = [
            { name: "Apple", emoji: "🍎" }, { name: "Banana", emoji: "🍌" },
            { name: "Orange", emoji: "🍊" }, { name: "Grape", emoji: "🍇" },
            { name: "Strawberry", emoji: "🍓" }, { name: "Watermelon", emoji: "🍉" },
            { name: "Mango", emoji: "🥭" }, { name: "Pineapple", emoji: "🍍" },
            { name: "Cherry", emoji: "🍒" }, { name: "Peach", emoji: "🍑" },
            { name: "Coconut", emoji: "🥥" }, { name: "Kiwi", emoji: "🥝" },
            { name: "Lemon", emoji: "🍋" }, { name: "Melon", emoji: "🍈" },
            { name: "Pear", emoji: "🍐" }, { name: "Papaya", emoji: "🥑" }, // Using avocado emoji as placeholder for some specific local fruits if needed, but let's stick to standard
            { name: "Blueberry", emoji: "🫐" }, { name: "Avocado", emoji: "🥑" },
            { name: "Tomato", emoji: "🍅" }, { name: "Green Apple", emoji: "🍏" }
        ];

        // Game Vocabulary Data - 20 Animals
        const animals = [
            { name: "Dog", emoji: "🐶" }, { name: "Cat", emoji: "🐱" },
            { name: "Mouse", emoji: "🐭" }, { name: "Hamster", emoji: "🐹" },
            { name: "Rabbit", emoji: "🐰" }, { name: "Fox", emoji: "🦊" },
            { name: "Bear", emoji: "🐻" }, { name: "Panda", emoji: "🐼" },
            { name: "Koala", emoji: "🐨" }, { name: "Tiger", emoji: "🐯" },
            { name: "Lion", emoji: "🦁" }, { name: "Cow", emoji: "🐮" },
            { name: "Pig", emoji: "🐷" }, { name: "Frog", emoji: "🐸" },
            { name: "Monkey", emoji: "🐵" }, { name: "Chicken", emoji: "🐔" },
            { name: "Penguin", emoji: "🐧" }, { name: "Bird", emoji: "🐦" },
            { name: "Elephant", emoji: "🐘" }, { name: "Horse", emoji: "🐴" }
        ];

        // State Variables
        let score = 0;
        let isPlaying = false;
        let currentQuestion = null;
        let isProcessingAnswer = false;
        let currentVocabulary = []; // Will hold either fruits or animals
        
        // DOM Elements
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const loadingOverlay = document.getElementById('loading-overlay');
        const mainMenu = document.getElementById('mainMenu');
        const gameCenter = document.getElementById('gameCenter');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreContainer = document.getElementById('scoreContainer');
        const itemDisplay = document.getElementById('itemDisplay');
        const leftText = document.getElementById('leftText');
        const rightText = document.getElementById('rightText');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const feedbackText = document.getElementById('feedbackText');
        const leftOptionUI = document.getElementById('leftOptionUI');
        const rightOptionUI = document.getElementById('rightOptionUI');

        const btnFruitsMode = document.getElementById('btnFruitsMode');
        const btnAnimalsMode = document.getElementById('btnAnimalsMode');

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        // Audio synthesis for fun feedback
        let synth, errorSynth;
        
        function initAudio() {
            if(synth) return; // Already initialized
            // Success sound (Bright, happy)
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 1 }
            }).toDestination();
            
            // Error sound (Low, blunt)
            errorSynth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.5 }
            }).toDestination();
        }

        function playSuccessSound() {
            if(!synth) return;
            Tone.start();
            synth.triggerAttackRelease(["C5", "E5", "G5"], "8n");
        }

        function playErrorSound() {
            if(!errorSynth) return;
            Tone.start();
            errorSynth.triggerAttackRelease("C3", "4n");
        }

        function startCameraAndGame(mode) {
            initAudio(); // Required to start Tone.js after user gesture
            
            // Set vocabulary based on selected mode
            if(mode === 'fruits') {
                currentVocabulary = fruits;
            } else if (mode === 'animals') {
                currentVocabulary = animals;
            }

            loadingOverlay.classList.remove('hidden');
            mainMenu.classList.add('hidden');
            
            // Start Camera if not already started
            if(!cameraStarted) {
                 camera.start().then(() => {
                    loadingOverlay.classList.add('hidden');
                    cameraStarted = true;
                    beginGameplay();
                }).catch(err => {
                    loadingOverlay.classList.add('hidden');
                    mainMenu.classList.remove('hidden');
                    alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้งานกล้องในเบราว์เซอร์ของคุณ");
                    console.error(err);
                });
            } else {
                loadingOverlay.classList.add('hidden');
                beginGameplay();
            }
        }

        function beginGameplay() {
            gameCenter.classList.remove('hidden');
            gameCenter.classList.add('flex');
            optionsContainer.classList.remove('hidden');
            optionsContainer.classList.add('flex');
            scoreContainer.classList.remove('hidden');
            scoreContainer.classList.add('flex');
            
            score = 0;
            updateScoreDisplay();
            isPlaying = true;
            nextQuestion();
        }

        function nextQuestion() {
            isProcessingAnswer = false;
            
            // Reset UI
            feedbackText.style.opacity = '0';
            itemDisplay.classList.remove('item-pop');
            leftOptionUI.classList.remove('bg-green-100', 'bg-red-100', 'border-b-green-500', 'border-b-red-500', 'border-b-orange-500');
            rightOptionUI.classList.remove('bg-green-100', 'bg-red-100', 'border-b-green-500', 'border-b-red-500', 'border-b-purple-500');
            
            leftOptionUI.classList.add('border-b-orange-500');
            rightOptionUI.classList.add('border-b-purple-500');

            leftOptionUI.style.transform = 'scale(1)';
            rightOptionUI.style.transform = 'scale(1)';

            // Pick a random item from current vocabulary
            const targetItem = currentVocabulary[Math.floor(Math.random() * currentVocabulary.length)];
            
            // Pick a wrong item
            let wrongItem;
            do {
                wrongItem = currentVocabulary[Math.floor(Math.random() * currentVocabulary.length)];
            } while (wrongItem.name === targetItem.name);

            // Randomize position (Left or Right)
            const isTargetLeft = Math.random() > 0.5;

            currentQuestion = {
                target: targetItem,
                leftOption: isTargetLeft ? targetItem.name : wrongItem.name,
                rightOption: !isTargetLeft ? targetItem.name : wrongItem.name,
                correctSide: isTargetLeft ? 'left' : 'right'
            };

            // Update DOM
            // Force reflow to restart animation
            void itemDisplay.offsetWidth; 
            itemDisplay.innerText = targetItem.emoji;
            itemDisplay.classList.add('item-pop');
            
            leftText.innerText = currentQuestion.leftOption;
            rightText.innerText = currentQuestion.rightOption;
        }

        function handleAnswer(selectedSide) {
            if (isProcessingAnswer || !isPlaying) return;
            isProcessingAnswer = true;

            const isCorrect = (selectedSide === currentQuestion.correctSide);
            const selectedUI = selectedSide === 'left' ? leftOptionUI : rightOptionUI;

            selectedUI.style.transform = 'scale(1.1)';

            if (isCorrect) {
                // Correct Answer
                score += 10;
                updateScoreDisplay();
                playSuccessSound();
                selectedUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                selectedUI.classList.add('bg-green-100', 'border-b-green-500');
                showFeedback("ถูกต้อง! 🎉", "text-green-500");
            } else {
                // Wrong Answer
                playErrorSound();
                selectedUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                selectedUI.classList.add('bg-red-100', 'border-b-red-500');
                
                // Highlight the correct one too
                const correctUI = currentQuestion.correctSide === 'left' ? leftOptionUI : rightOptionUI;
                correctUI.classList.remove('border-b-orange-500', 'border-b-purple-500');
                correctUI.classList.add('bg-green-100', 'border-b-green-500');
                
                showFeedback("ผิดจ้า! 😢", "text-red-500");
            }

            // Wait 2.5 seconds before next question to allow student to lower hands
            setTimeout(() => {
                nextQuestion();
            }, 2500);
        }

        function showFeedback(text, colorClass) {
            feedbackText.innerText = text;
            feedbackText.className = `text-5xl font-extrabold mt-4 h-16 transition-opacity drop-shadow-md ${colorClass}`;
            feedbackText.style.opacity = '1';
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = score;
        }

        function onResults(results) {
            // Ensure canvas matches video dimensions for drawing
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw video feed on canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            // Draw Landmarks if found
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#3B82F6', lineWidth: 2, radius: 4});

                    // Check interaction with game UI if playing
                    if (isPlaying && !isProcessingAnswer) {
                        // Use Index Finger Tip (Landmark 8) or Wrist (0) to detect general hand position
                        const referencePoint = landmarks[8]; // Index finger tip
                        
                        // Coordinates are normalized [0.0, 1.0].
                        // Y = 0.0 is top of screen.
                        // Our options are now at the TOP. Let's say if Y < 0.4 (top 40% of screen)
                        const rawY = referencePoint.y;
                        const rawX = referencePoint.x;

                        // Remember the mirror effect:
                        // Raw x = 1.0 (Right side of image) -> Appears on Left screen to user.
                        // Raw x = 0.0 (Left side of image) -> Appears on Right screen to user.
                        
                        // Hand is raised high enough
                        if (rawY < 0.4) {
                            if (rawX > 0.6) {
                                // Hand is on the raw-right (visual-left)
                                leftOptionUI.classList.add('active');
                                rightOptionUI.classList.remove('active');
                                handleAnswer('left');
                            } else if (rawX < 0.4) {
                                // Hand is on the raw-left (visual-right)
                                rightOptionUI.classList.add('active');
                                leftOptionUI.classList.remove('active');
                                handleAnswer('right');
                            } else {
                                leftOptionUI.classList.remove('active');
                                rightOptionUI.classList.remove('active');
                            }
                        } else {
                            // Hand is lowered
                            leftOptionUI.classList.remove('active');
                            rightOptionUI.classList.remove('active');
                        }
                    }
                }
            } else {
                 if (isPlaying && !isProcessingAnswer) {
                     leftOptionUI.classList.remove('active');
                     rightOptionUI.classList.remove('active');
                 }
            }
            canvasCtx.restore();
        }

        // Initialize MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, // 0 for faster, 1 for accurate
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Setup Camera
        let cameraStarted = false;
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        // Event Listeners for Mode Selection
        btnFruitsMode.addEventListener('click', () => startCameraAndGame('fruits'));
        btnAnimalsMode.addEventListener('click', () => startCameraAndGame('animals'));

        // Fullscreen Logic
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullScreen);

        // Listen for fullscreen changes to update the button icon
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                // Compress Icon (Exit Fullscreen)
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25" />`;
                fullscreenBtn.title = "ยุบหน้าจอ";
            } else {
                // Expand Icon (Enter Fullscreen)
                fullscreenIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />`;
                fullscreenBtn.title = "เต็มจอ";
            }
        });

        // Fix resize issues for canvas
        window.addEventListener('resize', () => {
            if(videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }
        });

    </script>
</body>
</html>
